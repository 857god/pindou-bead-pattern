name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只需要读权限；公开仓库里也别依赖默认值
permissions:
  contents: read

# 同一分支上连续 push 时，取消被顶掉的旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json 的 engines 与 vite 8 一致：^20.19.0 || >=22.12.0
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试（无需色卡数据，缺数据时相关用例自动跳过）
        run: npm test

      - name: 构建
        run: npm run build

      - name: 端到端冒烟（没有品牌色卡数据时自动用内置合成色卡）
        run: node scripts/smoke.mjs 96
